global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: xcs-web
    metrics_path: /internal/metrics/prometheus
    authorization:
      type: Bearer
      credentials_file: /run/secrets/xcs_metrics_token
    static_configs:
      - targets: ['web:3000']

  - job_name: xcs-postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: xcs-host
    static_configs:
      - targets: ['node-exporter:9100']
