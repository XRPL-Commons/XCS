# Optional local auth/admin/issuer validation, on top of docker-compose.yml.
services:
  web:
    environment:
      XCS_AUTH_ORIGIN: ${XCS_AUTH_ORIGIN:?Set exact local HTTPS origin}
      XCS_IDENTITY_CLIENT_ID: ${XCS_IDENTITY_CLIENT_ID:?Set identity client ID}
      XCS_IDENTITY_CLIENT_SECRET: ${XCS_IDENTITY_CLIENT_SECRET:?Set identity client secret}
      NUXT_APP_DATABASE_URL: postgres://xcs_app:local-development-only-not-a-secret-app@postgres:5432/xcs
      NUXT_ADMIN_DATABASE_URL: postgres://xcs_admin_app:local-development-only-not-a-secret-admin-app@postgres:5432/xcs
      XCS_ADMIN_DOCUMENT_KEY: ${XCS_ADMIN_DOCUMENT_KEY:?Set document signing key}
      NUXT_ISSUER_DATABASE_URL: postgres://xcs_issuer:local-development-only-not-a-secret-issuer@postgres:5432/xcs
      XCS_DOCUMENT_STORAGE_DRIVER: filesystem
      XCS_DOCUMENT_FILESYSTEM_DIRECTORY: /var/lib/xcs-review
      XCS_DOCUMENT_FILESYSTEM_LOCAL: '1'
      XCS_SMTP_HOST: mailpit
      XCS_SMTP_PORT: '1025'
    volumes:
      - xcs-review-documents:/var/lib/xcs-review
    networks: [edge, database, monitoring, application-mail]
  admin-notifier:
    image: ${XCS_NOTIFIER_IMAGE:-xcs-notifier:local}
    build:
      context: .
      dockerfile: apps/notifier/Dockerfile
    user: node
    environment:
      XCS_NOTIFIER_DATABASE_URL: postgres://xcs_notifier:local-development-only-not-a-secret-notifier@postgres:5432/xcs
      XCS_SMTP_HOST: mailpit
      XCS_SMTP_PORT: '1025'
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    networks: [database, application-mail]
    init: true
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 100
    stop_grace_period: 75s
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.29.2
    user: '1000:1000'
    environment:
      MP_DISABLE_VERSION_CHECK: 'true'
      MP_SMTP_DISABLE_RDNS: 'true'
      MP_MAX_MESSAGES: '0'
    ports: ['127.0.0.1:${XCS_MAILPIT_PORT:-8025}:8025']
    networks: [application-mail, mail-ui]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
networks:
  application-mail:
    internal: true
  mail-ui:
volumes:
  xcs-review-documents:
