<text x="24" y="62" font-family="Arial, sans-serif" font-size="23" fill="#252525" dominant-baseline="text-before-edge"><tspan x="24" dy="0">Request full-detail</tspan><tspan x="24" dy="29.900000000000002">access</tspan></text>
<text x="24" y="133.8" font-family="Arial, sans-serif" font-size="14" fill="#252525" dominant-baseline="text-before-edge"><tspan x="24" dy="0">Explain your organization and your need.</tspan></text>
