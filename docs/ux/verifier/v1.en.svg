<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">V1 — Request full-detail access</title>
<desc id="desc">Explain your organization and your need. After global approval, the recipient must share with your verifier identity.</desc>
