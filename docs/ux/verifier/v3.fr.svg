<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc" xml:lang="fr">
<title id="title">V3 — Émetteur non reconnu</title>
<desc id="desc">Les contrôles techniques ont réussi. Évaluez l’émetteur séparément. Les contrôles ne prouvent pas la vérité des déclarations. Identité, autorisation et partage sont revérifiés.</desc>
