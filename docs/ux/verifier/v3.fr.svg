<text x="34" y="372.7" font-family="Arial, sans-serif" font-size="13" fill="#555555" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Champs complets</tspan></text>
<text x="34" y="392.7" font-family="Arial, sans-serif" font-size="14" fill="#252525" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Camille Exemple · Initiation XRPL ·</tspan><tspan x="34" dy="18.2">23/09/2026</tspan></text>
