<text x="34" y="254.3" font-family="Arial, sans-serif" font-size="14" fill="#252525" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Ledger : active · Schéma : valide</tspan></text>
<rect x="24" y="294.5" width="342" height="59.2" rx="3" fill="#ffffff" stroke="#b4b4b4"/>
