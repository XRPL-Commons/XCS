<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc" xml:lang="fr">
<title id="title">V2 — Vérification partielle</title>
<desc id="desc">L’attestation est active. Le contenu complet n’a pas été contrôlé. L’autorisation d’utiliser XCS n’est pas une garantie de l’émetteur. Aucun score de confiance.</desc>
