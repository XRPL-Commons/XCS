<text x="24" y="602.0999999999999" font-family="Arial, sans-serif" font-size="12" fill="#555555" dominant-baseline="text-before-edge"><tspan x="24" dy="0">Resend or revoke from the list. Issue only after</tspan><tspan x="24" dy="15.600000000000001">the wallet is linked.</tspan></text>
<text x="24" y="821" font-family="Arial, sans-serif" font-size="10" fill="#666666" dominant-baseline="text-before-edge"><tspan x="24" dy="0">WIREFRAME · Fictional example · Non-functional</tspan></text>
