<text x="24" y="602.0999999999999" font-family="Arial, sans-serif" font-size="12" fill="#555555" dominant-baseline="text-before-edge"><tspan x="24" dy="0">Revocation needs confirmation and signing.</tspan><tspan x="24" dy="15.600000000000001">Pending publication resumes without issuing</tspan><tspan x="24" dy="15.600000000000001">again.</tspan></text>
