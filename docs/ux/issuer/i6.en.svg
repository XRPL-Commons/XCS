<text x="34" y="424.9" font-family="Arial, sans-serif" font-size="13" fill="#555555" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Acceptance and notification</tspan></text>
<text x="34" y="444.9" font-family="Arial, sans-serif" font-size="14" fill="#252525" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Acceptance pending · Notification queued</tspan></text>
