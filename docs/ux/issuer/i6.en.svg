<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">I6 — Track attestation</title>
<desc id="desc">Track issuance, content and acceptance separately. Revocation needs confirmation and signing. Pending publication resumes without issuing again.</desc>
<rect x="0" y="0" width="390" height="844" rx="3" fill="#ffffff" stroke="#777777"/>
<rect x="0" y="0" width="390" height="42" rx="3" fill="#eeeeee" stroke="#777777"/>
<text x="20" y="12" font-family="Arial, sans-serif" font-size="13" fill="#252525" dominant-baseline="text-before-edge"><tspan x="20" dy="0">XCS / Issuer</tspan></text>
<text x="24" y="62" font-family="Arial, sans-serif" font-size="23" fill="#252525" dominant-baseline="text-before-edge"><tspan x="24" dy="0">Track attestation</tspan></text>
<text x="24" y="103.9" font-family="Arial, sans-serif" font-size="14" fill="#252525" dominant-baseline="text-before-edge"><tspan x="24" dy="0">Track issuance, content and acceptance</tspan><tspan x="24" dy="18.2">separately.</tspan></text>
