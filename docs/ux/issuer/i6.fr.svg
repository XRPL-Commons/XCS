<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc" xml:lang="fr">
<title id="title">I6 — Suivre l’attestation</title>
<desc id="desc">Suivre l’émission, le contenu et l’acceptation. Révoquer demande confirmation et signature. Une publication en attente se reprend sans réémettre.</desc>
<rect x="0" y="0" width="390" height="844" rx="3" fill="#ffffff" stroke="#777777"/>
<rect x="0" y="0" width="390" height="42" rx="3" fill="#eeeeee" stroke="#777777"/>
<text x="20" y="12" font-family="Arial, sans-serif" font-size="13" fill="#252525" dominant-baseline="text-before-edge"><tspan x="20" dy="0">XCS / Émetteur</tspan></text>
<text x="24" y="62" font-family="Arial, sans-serif" font-size="23" fill="#252525" dominant-baseline="text-before-edge"><tspan x="24" dy="0">Suivre l’attestation</tspan></text>
<text x="24" y="103.9" font-family="Arial, sans-serif" font-size="14" fill="#252525" dominant-baseline="text-before-edge"><tspan x="24" dy="0">Suivre l’émission, le contenu et</tspan><tspan x="24" dy="18.2">l’acceptation.</tspan></text>
<rect x="24" y="155.3" width="342" height="37" rx="3" fill="#eeeeee" stroke="#b4b4b4"/>
<text x="34" y="165.3" font-family="Arial, sans-serif" font-size="13" fill="#252525" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Émise · En attente d’acceptation</tspan></text>
<rect x="24" y="208.3" width="342" height="59.2" rx="3" fill="#ffffff" stroke="#b4b4b4"/>
<text x="34" y="217.3" font-family="Arial, sans-serif" font-size="13" fill="#555555" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Destinataire et formation</tspan></text>
<text x="34" y="237.3" font-family="Arial, sans-serif" font-size="14" fill="#252525" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Camille Exemple · Initiation XRPL</tspan></text>
<rect x="24" y="277.5" width="342" height="59.2" rx="3" fill="#ffffff" stroke="#b4b4b4"/>
<text x="34" y="286.5" font-family="Arial, sans-serif" font-size="13" fill="#555555" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Émission sur XRPL</tspan></text>
<text x="34" y="306.5" font-family="Arial, sans-serif" font-size="14" fill="#252525" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Confirmée sur le ledger</tspan></text>
<rect x="24" y="346.7" width="342" height="59.2" rx="3" fill="#ffffff" stroke="#b4b4b4"/>
<text x="34" y="355.7" font-family="Arial, sans-serif" font-size="13" fill="#555555" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Disponibilité du contenu</tspan></text>
<text x="34" y="375.7" font-family="Arial, sans-serif" font-size="14" fill="#252525" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Publié · Accès privé</tspan></text>
<rect x="24" y="415.9" width="342" height="77.4" rx="3" fill="#ffffff" stroke="#b4b4b4"/>
<text x="34" y="424.9" font-family="Arial, sans-serif" font-size="13" fill="#555555" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Acceptation et notification</tspan></text>
<text x="34" y="444.9" font-family="Arial, sans-serif" font-size="14" fill="#252525" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Acceptation en attente · Notification en</tspan><tspan x="34" dy="18.2">file</tspan></text>
<rect x="24" y="509.29999999999995" width="342" height="44" rx="3" fill="#333333" stroke="#333333"/>
<text x="36" y="522.1999999999999" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" dominant-baseline="text-before-edge"><tspan x="36" dy="0">Actualiser le statut</tspan></text>
<rect x="24" y="563.3" width="342" height="44" rx="3" fill="#ffffff" stroke="#333333"/>
<text x="36" y="576.1999999999999" font-family="Arial, sans-serif" font-size="14" fill="#252525" dominant-baseline="text-before-edge"><tspan x="36" dy="0">Révoquer l’attestation…</tspan></text>
<text x="24" y="620.3" font-family="Arial, sans-serif" font-size="12" fill="#555555" dominant-baseline="text-before-edge"><tspan x="24" dy="0">Révoquer demande confirmation et signature. Une</tspan><tspan x="24" dy="15.600000000000001">publication en attente se reprend sans réémettre.</tspan></text>
<text x="24" y="821" font-family="Arial, sans-serif" font-size="10" fill="#666666" dominant-baseline="text-before-edge"><tspan x="24" dy="0">MAQUETTE · Exemple fictif · Non fonctionnel</tspan></text>
</svg>
