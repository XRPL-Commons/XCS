<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc" xml:lang="fr">
<title id="title">R5 — Présenter mon attestation</title>
<desc id="desc">Choisir qui peut lire les champs, puis gérer le partage. Après création : lien et QR. Un lien transféré ne donne pas les champs privés à un autre vérificateur.</desc>
<rect x="0" y="0" width="390" height="844" rx="3" fill="#ffffff" stroke="#777777"/>
<rect x="0" y="0" width="390" height="42" rx="3" fill="#eeeeee" stroke="#777777"/>
<text x="20" y="12" font-family="Arial, sans-serif" font-size="13" fill="#252525" dominant-baseline="text-before-edge"><tspan x="20" dy="0">XCS / Destinataire</tspan></text>
<text x="24" y="62" font-family="Arial, sans-serif" font-size="23" fill="#252525" dominant-baseline="text-before-edge"><tspan x="24" dy="0">Présenter mon attestation</tspan></text>
<text x="24" y="103.9" font-family="Arial, sans-serif" font-size="14" fill="#252525" dominant-baseline="text-before-edge"><tspan x="24" dy="0">Choisir qui peut lire les champs, puis</tspan><tspan x="24" dy="18.2">gérer le partage.</tspan></text>
<rect x="24" y="155.3" width="342" height="37" rx="3" fill="#eeeeee" stroke="#b4b4b4"/>
<text x="34" y="165.3" font-family="Arial, sans-serif" font-size="13" fill="#252525" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Attestation acceptée</tspan></text>
<rect x="24" y="208.3" width="342" height="59.2" rx="3" fill="#ffffff" stroke="#b4b4b4"/>
<text x="34" y="217.3" font-family="Arial, sans-serif" font-size="13" fill="#555555" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Portée du partage</tspan></text>
<text x="34" y="237.3" font-family="Arial, sans-serif" font-size="14" fill="#252525" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Champs publics seuls · Tous les champs ✓</tspan></text>
<rect x="24" y="277.5" width="342" height="77.4" rx="3" fill="#ffffff" stroke="#b4b4b4"/>
<text x="34" y="286.5" font-family="Arial, sans-serif" font-size="13" fill="#555555" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Pour partager les champs privés</tspan></text>
<text x="34" y="306.5" font-family="Arial, sans-serif" font-size="14" fill="#252525" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Choisir un vérificateur autorisé : Bureau</tspan><tspan x="34" dy="18.2">Exemple</tspan></text>
<rect x="24" y="364.9" width="342" height="59.2" rx="3" fill="#ffffff" stroke="#b4b4b4"/>
<text x="34" y="373.9" font-family="Arial, sans-serif" font-size="13" fill="#555555" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Durée du partage</tspan></text>
<text x="34" y="393.9" font-family="Arial, sans-serif" font-size="14" fill="#252525" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Jusqu’à révocation · Aucun renouvellement</tspan></text>
<rect x="24" y="434.09999999999997" width="342" height="59.2" rx="3" fill="#ffffff" stroke="#b4b4b4"/>
<text x="34" y="443.09999999999997" font-family="Arial, sans-serif" font-size="13" fill="#555555" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Aperçu pour Bureau Exemple</tspan></text>
<text x="34" y="463.09999999999997" font-family="Arial, sans-serif" font-size="14" fill="#252525" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Nom, formation, date · Connexion requise</tspan></text>
<rect x="24" y="509.29999999999995" width="342" height="44" rx="3" fill="#333333" stroke="#333333"/>
<text x="36" y="522.1999999999999" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" dominant-baseline="text-before-edge"><tspan x="36" dy="0">Vérifier puis créer le partage</tspan></text>
<rect x="24" y="563.3" width="342" height="44" rx="3" fill="#ffffff" stroke="#333333"/>
<text x="36" y="576.1999999999999" font-family="Arial, sans-serif" font-size="14" fill="#252525" dominant-baseline="text-before-edge"><tspan x="36" dy="0">Voir et révoquer mes partages</tspan></text>
<text x="24" y="620.3" font-family="Arial, sans-serif" font-size="12" fill="#555555" dominant-baseline="text-before-edge"><tspan x="24" dy="0">Après création : lien et QR. Un lien transféré ne</tspan><tspan x="24" dy="15.600000000000001">donne pas les champs privés à un autre</tspan><tspan x="24" dy="15.600000000000001">vérificateur.</tspan></text>
<text x="24" y="821" font-family="Arial, sans-serif" font-size="10" fill="#666666" dominant-baseline="text-before-edge"><tspan x="24" dy="0">MAQUETTE · Exemple fictif · Non fonctionnel</tspan></text>
</svg>
