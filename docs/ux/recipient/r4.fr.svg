<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc" xml:lang="fr">
<title id="title">R4 — Examiner avant d’accepter</title>
<desc id="desc">Lire le contenu seulement après votre accord. Émetteur inconnu : accord explicite avant acceptation. Émetteur non fiable : acceptation bloquée. Refuser ne télécharge rien.</desc>
