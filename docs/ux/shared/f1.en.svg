<text x="34" y="355.7" font-family="Arial, sans-serif" font-size="13" fill="#555555" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Required network</tspan></text>
<text x="34" y="375.7" font-family="Arial, sans-serif" font-size="14" fill="#252525" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Testnet · Check the selected account</tspan></text>
<rect x="24" y="421.9" width="342" height="44" rx="3" fill="#333333" stroke="#333333"/>
<text x="36" y="434.79999999999995" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" dominant-baseline="text-before-edge"><tspan x="36" dy="0">Refresh detection</tspan></text>
<rect x="24" y="475.9" width="342" height="44" rx="3" fill="#ffffff" stroke="#333333"/>
<text x="36" y="488.79999999999995" font-family="Arial, sans-serif" font-size="14" fill="#252525" dominant-baseline="text-before-edge"><tspan x="36" dy="0">Choose another wallet</tspan></text>
<text x="24" y="532.9" font-family="Arial, sans-serif" font-size="12" fill="#555555" dominant-baseline="text-before-edge"><tspan x="24" dy="0">An XRP Identity account does not replace a</tspan><tspan x="24" dy="15.600000000000001">wallet. Reading a public presentation needs no</tspan><tspan x="24" dy="15.600000000000001">wallet.</tspan></text>
<text x="24" y="821" font-family="Arial, sans-serif" font-size="10" fill="#666666" dominant-baseline="text-before-edge"><tspan x="24" dy="0">WIREFRAME · Fictional example · Non-functional</tspan></text>
