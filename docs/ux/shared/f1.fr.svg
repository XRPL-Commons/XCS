<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc" xml:lang="fr">
<title id="title">F1 — Portefeuille indisponible</title>
<desc id="desc">Votre progression est conservée. Préparons le portefeuille. Un compte XRP Identity ne remplace pas un portefeuille. Lire une présentation publique n’en demande pas.</desc>
<rect x="0" y="0" width="390" height="844" rx="3" fill="#ffffff" stroke="#777777"/>
<rect x="0" y="0" width="390" height="42" rx="3" fill="#eeeeee" stroke="#777777"/>
<text x="20" y="12" font-family="Arial, sans-serif" font-size="13" fill="#252525" dominant-baseline="text-before-edge"><tspan x="20" dy="0">XCS / États partagés</tspan></text>
<text x="24" y="62" font-family="Arial, sans-serif" font-size="23" fill="#252525" dominant-baseline="text-before-edge"><tspan x="24" dy="0">Portefeuille indisponible</tspan></text>
<text x="24" y="103.9" font-family="Arial, sans-serif" font-size="14" fill="#252525" dominant-baseline="text-before-edge"><tspan x="24" dy="0">Votre progression est conservée. Préparons</tspan><tspan x="24" dy="18.2">le portefeuille.</tspan></text>
<rect x="24" y="155.3" width="342" height="37" rx="3" fill="#eeeeee" stroke="#b4b4b4"/>
<text x="34" y="165.3" font-family="Arial, sans-serif" font-size="13" fill="#252525" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Aucune signature demandée</tspan></text>
<rect x="24" y="208.3" width="342" height="59.2" rx="3" fill="#ffffff" stroke="#b4b4b4"/>
<text x="34" y="217.3" font-family="Arial, sans-serif" font-size="13" fill="#555555" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Déjà installé ?</tspan></text>
<text x="34" y="237.3" font-family="Arial, sans-serif" font-size="14" fill="#252525" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Déverrouiller puis relancer la détection</tspan></text>
<rect x="24" y="277.5" width="342" height="77.4" rx="3" fill="#ffffff" stroke="#b4b4b4"/>
<text x="34" y="286.5" font-family="Arial, sans-serif" font-size="13" fill="#555555" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Pas encore installé ?</tspan></text>
<text x="34" y="306.5" font-family="Arial, sans-serif" font-size="14" fill="#252525" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Instructions pour un portefeuille</tspan><tspan x="34" dy="18.2">compatible</tspan></text>
<rect x="24" y="364.9" width="342" height="59.2" rx="3" fill="#ffffff" stroke="#b4b4b4"/>
<text x="34" y="373.9" font-family="Arial, sans-serif" font-size="13" fill="#555555" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Réseau requis</tspan></text>
<text x="34" y="393.9" font-family="Arial, sans-serif" font-size="14" fill="#252525" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Testnet · Vérifier le compte sélectionné</tspan></text>
<rect x="24" y="440.09999999999997" width="342" height="44" rx="3" fill="#333333" stroke="#333333"/>
<text x="36" y="452.99999999999994" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" dominant-baseline="text-before-edge"><tspan x="36" dy="0">Relancer la détection</tspan></text>
<rect x="24" y="494.09999999999997" width="342" height="44" rx="3" fill="#ffffff" stroke="#333333"/>
<text x="36" y="506.99999999999994" font-family="Arial, sans-serif" font-size="14" fill="#252525" dominant-baseline="text-before-edge"><tspan x="36" dy="0">Choisir un autre portefeuille</tspan></text>
<text x="24" y="551.0999999999999" font-family="Arial, sans-serif" font-size="12" fill="#555555" dominant-baseline="text-before-edge"><tspan x="24" dy="0">Un compte XRP Identity ne remplace pas un</tspan><tspan x="24" dy="15.600000000000001">portefeuille. Lire une présentation publique n’en</tspan><tspan x="24" dy="15.600000000000001">demande pas.</tspan></text>
<text x="24" y="821" font-family="Arial, sans-serif" font-size="10" fill="#666666" dominant-baseline="text-before-edge"><tspan x="24" dy="0">MAQUETTE · Exemple fictif · Non fonctionnel</tspan></text>
</svg>
