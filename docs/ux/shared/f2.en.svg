<text x="24" y="478.9" font-family="Arial, sans-serif" font-size="12" fill="#555555" dominant-baseline="text-before-edge"><tspan x="24" dy="0">Use your known issuer contact. This message does</tspan><tspan x="24" dy="15.600000000000001">not reveal who used the link.</tspan></text>
