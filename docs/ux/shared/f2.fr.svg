<rect x="24" y="295.70000000000005" width="342" height="59.2" rx="3" fill="#ffffff" stroke="#b4b4b4"/>
<text x="34" y="304.70000000000005" font-family="Arial, sans-serif" font-size="13" fill="#555555" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Votre compte</tspan></text>
