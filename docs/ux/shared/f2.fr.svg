<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc" xml:lang="fr">
<title id="title">F2 — Invitation inutilisable</title>
<desc id="desc">Ce lien a expiré ou ne peut plus être utilisé. Utilisez votre contact habituel chez l’émetteur. Ce message ne révèle pas qui a utilisé le lien.</desc>
