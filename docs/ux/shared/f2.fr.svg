<text x="34" y="373.90000000000003" font-family="Arial, sans-serif" font-size="13" fill="#555555" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Confidentialité</tspan></text>
<text x="34" y="393.90000000000003" font-family="Arial, sans-serif" font-size="14" fill="#252525" dominant-baseline="text-before-edge"><tspan x="34" dy="0">Aucune information de destinataire affichée</tspan></text>
