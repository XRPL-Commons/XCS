<text x="24" y="497.1" font-family="Arial, sans-serif" font-size="12" fill="#555555" dominant-baseline="text-before-edge"><tspan x="24" dy="0">Utilisez votre contact habituel chez l’émetteur.</tspan><tspan x="24" dy="15.600000000000001">Ce message ne révèle pas qui a utilisé le lien.</tspan></text>
