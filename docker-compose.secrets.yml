# Production secret-file overlay. The base file keeps direct environment values
# for local development; this overlay removes them and uses mounted files only.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets: [postgres_admin_password]

  db-bootstrap:
    environment:
      XCS_DATABASE_PASSWORD: !reset null
      XCS_DATABASE_PASSWORD_FILE: /run/secrets/postgres_admin_password
      XCS_INDEXER_DATABASE_PASSWORD: !reset null
      XCS_INDEXER_DATABASE_PASSWORD_FILE: /run/secrets/indexer_database_password
      XCS_API_DATABASE_PASSWORD: !reset null
      XCS_API_DATABASE_PASSWORD_FILE: /run/secrets/api_database_password
      XCS_MONITOR_DATABASE_PASSWORD: !reset null
      XCS_MONITOR_DATABASE_PASSWORD_FILE: /run/secrets/monitor_database_password
    secrets:
      [
        postgres_admin_password,
        indexer_database_password,
        api_database_password,
        monitor_database_password,
      ]

  api:
    environment:
      XCS_DATABASE_PASSWORD: !reset null
      XCS_DATABASE_PASSWORD_FILE: /run/secrets/api_database_password
      XCS_INTERNAL_API_TOKEN: !reset null
      XCS_INTERNAL_API_TOKEN_FILE: /run/secrets/internal_api_token
      XCS_METRICS_TOKEN: !reset null
      XCS_METRICS_TOKEN_FILE: /run/secrets/xcs_metrics_token
    secrets: [api_database_password, internal_api_token, xcs_metrics_token]

  indexer:
    environment:
      XCS_DATABASE_PASSWORD: !reset null
      XCS_DATABASE_PASSWORD_FILE: /run/secrets/indexer_database_password
      XCS_RPC_URL_PRIMARY: !reset null
      XCS_RPC_URL_PRIMARY_FILE: /run/secrets/rpc_url_primary
      XCS_RPC_URL_SECONDARY: !reset null
      XCS_RPC_URL_SECONDARY_FILE: /run/secrets/rpc_url_secondary
    secrets: [indexer_database_password, rpc_url_primary, rpc_url_secondary]

  web:
    environment:
      NUXT_API_INTERNAL_TOKEN: !reset null
      NUXT_API_INTERNAL_TOKEN_FILE: /run/secrets/internal_api_token
    secrets: [internal_api_token]

secrets:
  postgres_admin_password:
    file: ${XCS_POSTGRES_ADMIN_PASSWORD_FILE:?Set XCS_POSTGRES_ADMIN_PASSWORD_FILE}
  indexer_database_password:
    file: ${XCS_INDEXER_DATABASE_PASSWORD_FILE:?Set XCS_INDEXER_DATABASE_PASSWORD_FILE}
  api_database_password:
    file: ${XCS_API_DATABASE_PASSWORD_FILE:?Set XCS_API_DATABASE_PASSWORD_FILE}
  monitor_database_password:
    file: ${XCS_MONITOR_DATABASE_PASSWORD_FILE:?Set XCS_MONITOR_DATABASE_PASSWORD_FILE}
  internal_api_token:
    file: ${XCS_INTERNAL_API_TOKEN_FILE:?Set XCS_INTERNAL_API_TOKEN_FILE}
  xcs_metrics_token:
    file: ${XCS_METRICS_TOKEN_FILE:?Set XCS_METRICS_TOKEN_FILE}
  rpc_url_primary:
    file: ${XCS_RPC_URL_PRIMARY_FILE:?Set XCS_RPC_URL_PRIMARY_FILE}
  rpc_url_secondary:
    file: ${XCS_RPC_URL_SECONDARY_FILE:?Set XCS_RPC_URL_SECONDARY_FILE}
