name: Operations

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: xcs-ci-${{ github.run_id }}-${{ github.run_attempt }}
      XCS_POSTGRES_ADMIN_PASSWORD: compose-ci-admin-password-00000001
      XCS_INDEXER_DATABASE_PASSWORD: compose-ci-indexer-password-0001
      XCS_API_DATABASE_PASSWORD: compose-ci-api-password-000000001
      XCS_MONITOR_DATABASE_PASSWORD: compose-ci-monitor-password-000001
      XCS_METRICS_ENABLED: 'true'
      XCS_METRICS_TOKEN: compose-ci-metrics-token-000000000001
      XCS_RPC_URL_PRIMARY: wss://primary.invalid.example
      XCS_RPC_URL_SECONDARY: wss://secondary.invalid.example
      XCS_NETWORK_PROFILE: /workspace/config/networks/testnet.example.json
      XCS_PUBLIC_RPC_URL: wss://submission.invalid.example
      XCS_INDEXER_IMAGE: xcs-indexer:ci
      XCS_WEB_IMAGE: xcs-web:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Prometheus reads the metrics bearer token with `credentials_file` and runs
      # read_only, so Compose can only supply it as a file secret. Creating it is an
      # explicit step here exactly as docs/runbooks/monitoring.md asks operators to do.
      - name: Materialize the monitoring Compose secret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/secrets
          install -m 600 /dev/null ops/secrets/xcs_metrics_token
          printf '%s' "$XCS_METRICS_TOKEN" > ops/secrets/xcs_metrics_token
          test -s ops/secrets/xcs_metrics_token

      - name: Render and validate every Compose profile
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose --profile monitoring --profile demo-pinning config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile monitoring config --quiet

          mapfile -t DEFAULT_SERVICES < <(docker compose config --services | sort)
          EXPECTED=(db-bootstrap indexer postgres web)
          if [[ "${DEFAULT_SERVICES[*]}" != "${EXPECTED[*]}" ]]; then
            printf 'Unexpected default services: %s\n' "${DEFAULT_SERVICES[*]}" >&2
            exit 1
          fi

          docker compose --profile monitoring --profile demo-pinning config --format json \
            > "$RUNNER_TEMP/xcs-compose.json"
          jq -e '
            (.services.postgres.ports == null) and
            (.services.prometheus.ports == null) and
            (.services.grafana.ports == null) and
            (.services["postgres-exporter"].ports == null) and
            (.services["node-exporter"].ports == null) and
            (.services.ipfs.ports == null) and
            (.services.prometheus.profiles | index("monitoring") != null) and
            (.services.grafana.profiles | index("monitoring") != null) and
            (.networks.database.internal == true) and
            (.networks.monitoring.internal == true) and
            ([.services[] | select(.image | endswith(":latest"))] | length == 0)
          ' "$RUNNER_TEMP/xcs-compose.json"

          docker compose -f docker-compose.yml -f docker-compose.dev.yml \
            --profile monitoring --profile demo-pinning config --format json \
            > "$RUNNER_TEMP/xcs-compose-dev.json"
          jq -e '
            [
              .services.postgres.ports[],
              .services.prometheus.ports[],
              .services.grafana.ports[],
              .services.ipfs.ports[]
            ] | all(.host_ip == "127.0.0.1")
          ' "$RUNNER_TEMP/xcs-compose-dev.json"

      - name: Validate monitoring configuration with Prometheus
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile monitoring run --rm --no-deps \
            --entrypoint /bin/promtool prometheus \
            check config /etc/prometheus/prometheus.yml
          docker compose --profile monitoring run --rm --no-deps \
            --entrypoint /bin/promtool prometheus \
            check rules /etc/prometheus/rules/xcs-alerts.yml
          docker compose --profile monitoring run --rm --no-deps \
            --entrypoint /bin/promtool prometheus \
            test rules /etc/prometheus/tests/xcs-alerts.test.yml
          jq empty ops/monitoring/grafana/dashboards/*.json

      - name: Build production-only core images
        run: docker compose build web indexer

      - name: Assert runtime images exclude development tools
        shell: bash
        run: |
          set -euo pipefail
          for IMAGE in "$XCS_WEB_IMAGE" "$XCS_INDEXER_IMAGE"; do
            docker run --rm --entrypoint sh "$IMAGE" -c \
              'test ! -e node_modules/typescript && test ! -e node_modules/vitest && test ! -e node_modules/tsx'
          done

      - name: Smoke the Compose stack
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            "${COMPOSE[@]}" logs --no-color > "$RUNNER_TEMP/xcs-compose.log" 2>&1 || true
            "${COMPOSE[@]}" down --volumes --remove-orphans || true
          }
          trap cleanup EXIT

          COMPOSE=(docker compose -f docker-compose.yml)
          # `--wait web` starts postgres, runs db-bootstrap to completion and
          # waits for the web healthcheck. The `indexer` service is deliberately
          # not started: without an operator-supplied network profile and a
          # complete-history endpoint it refuses to run past the
          # SOURCE_REGISTRY_NOT_BLACKHOLED preflight, so it has no steady state
          # CI could assert. Its image is still built and scanned above.
          "${COMPOSE[@]}" up --no-build --detach --wait web

          for SERVICE in postgres web; do
            CONTAINER="$("${COMPOSE[@]}" ps --quiet "$SERVICE")"
            HEALTH="$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER")"
            if [[ "$HEALTH" != 'healthy' ]]; then
              echo "$SERVICE is $HEALTH, expected healthy" >&2
              exit 1
            fi
          done

          BOOTSTRAP_CONTAINER="$("${COMPOSE[@]}" ps --all --quiet db-bootstrap)"
          read -r BOOTSTRAP_STATE BOOTSTRAP_EXIT < <(
            docker inspect --format '{{.State.Status}} {{.State.ExitCode}}' "$BOOTSTRAP_CONTAINER"
          )
          if [[ "$BOOTSTRAP_STATE" != 'exited' || "$BOOTSTRAP_EXIT" != '0' ]]; then
            echo "db-bootstrap is $BOOTSTRAP_STATE with exit code $BOOTSTRAP_EXIT" >&2
            exit 1
          fi

          # The bootstrap is deliberately restart-safe. Run it again after the
          # dependency chain has completed to prove repeated initialization and
          # role provisioning do not require a clean volume.
          "${COMPOSE[@]}" run --rm --no-deps db-bootstrap

          curl --fail --silent --show-error http://127.0.0.1:3000/health/live > /dev/null
          READY_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/health/ready)"
          test "$READY_STATUS" = '503'
          UNAUTHENTICATED_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/internal/metrics/prometheus)"
          test "$UNAUTHENTICATED_STATUS" = '401'
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $XCS_METRICS_TOKEN" \
            http://127.0.0.1:3000/internal/metrics/prometheus \
            | grep --fixed-strings 'xcs_database_available'

          if "${COMPOSE[@]}" ps --services --status running | grep --extended-regexp '^(prometheus|grafana|postgres-exporter|node-exporter|ipfs)$'; then
            echo 'A non-core profile service started unexpectedly' >&2
            exit 1
          fi
          if PUBLISHED_POSTGRES="$("${COMPOSE[@]}" port postgres 5432 2>/dev/null)" && [[ -n "$PUBLISHED_POSTGRES" ]]; then
            echo "PostgreSQL was unexpectedly published at $PUBLISHED_POSTGRES" >&2
            exit 1
          fi

          "${COMPOSE[@]}" exec -T postgres psql -U xcs_admin -d xcs --no-psqlrc --tuples-only --no-align \
            --command "
              SELECT
                pg_has_role('xcs_monitor', 'pg_monitor', 'MEMBER')
                AND (SELECT rolconnlimit FROM pg_roles WHERE rolname = 'xcs_indexer') = 12
                AND (SELECT rolconnlimit FROM pg_roles WHERE rolname = 'xcs_api') = 12
                AND (SELECT rolconnlimit FROM pg_roles WHERE rolname = 'xcs_monitor') = 3
                AND NOT has_schema_privilege('xcs_monitor', 'public', 'CREATE')
                AND NOT EXISTS (
                  SELECT 1
                  FROM pg_database database_object
                  CROSS JOIN LATERAL aclexplode(
                    COALESCE(
                      database_object.datacl,
                      acldefault('d', database_object.datdba)
                    )
                  ) database_acl
                  WHERE database_object.datname = current_database()
                    AND database_acl.grantee = 0
                    AND database_acl.privilege_type IN ('CONNECT', 'TEMPORARY')
                )
                AND NOT EXISTS (
                  SELECT 1
                  FROM pg_class relation
                  JOIN pg_namespace namespace ON namespace.oid = relation.relnamespace
                  WHERE namespace.nspname = 'public'
                    AND relation.relkind IN ('r', 'p')
                    AND (
                      has_table_privilege('xcs_monitor', relation.oid, 'INSERT')
                      OR has_table_privilege('xcs_monitor', relation.oid, 'UPDATE')
                      OR has_table_privilege('xcs_monitor', relation.oid, 'DELETE')
                      OR has_table_privilege('xcs_monitor', relation.oid, 'TRUNCATE')
                    )
                );
            " | grep --fixed-strings --line-regexp t

          "${COMPOSE[@]}" --profile monitoring up --no-build --detach --wait postgres-exporter prometheus
          PROMETHEUS_CONTAINER="$("${COMPOSE[@]}" --profile monitoring ps --quiet prometheus)"
          PROMETHEUS_STATE="$(docker inspect --format '{{.State.Status}}' "$PROMETHEUS_CONTAINER")"
          if [[ "$PROMETHEUS_STATE" != 'running' ]]; then
            echo "prometheus is $PROMETHEUS_STATE, expected running" >&2
            exit 1
          fi
          # The file secret must arrive verbatim, or the scrape would silently 401.
          docker exec "$PROMETHEUS_CONTAINER" cat /run/secrets/xcs_metrics_token \
            | grep --fixed-strings --line-regexp --quiet "$XCS_METRICS_TOKEN"
          "${COMPOSE[@]}" exec -T web node -e '
            const waitForExporter = async () => {
              for (let attempt = 0; attempt < 20; attempt += 1) {
                try {
                  const response = await fetch("http://postgres-exporter:9187/metrics")
                  const body = await response.text()
                  if (response.ok && /^pg_up 1$/mu.test(body)) return
                } catch {}
                await new Promise((resolve) => setTimeout(resolve, 500))
              }
              process.exit(1)
            }
            waitForExporter().catch(() => process.exit(1))
          '

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: compose-logs
          path: ${{ runner.temp }}/xcs-compose.log
          if-no-files-found: ignore
          retention-days: 14

  dockerfile-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce runtime image boundaries
        shell: bash
        run: |
          set -euo pipefail
          for DOCKERFILE in apps/web/Dockerfile apps/indexer/Dockerfile; do
            grep --fixed-strings -- 'USER node' "$DOCKERFILE"
            grep --fixed-strings -- 'pnpm install --frozen-lockfile' "$DOCKERFILE"
            if grep --extended-regexp 'RUN --mount|<<[A-Z]' "$DOCKERFILE"; then
              echo "$DOCKERFILE uses BuildKit-only syntax" >&2
              exit 1
            fi
            if grep --extended-regexp 'COPY --from=build( --chown=node:node)? /workspace/? ' "$DOCKERFILE"; then
              echo 'The production image must not copy the complete build workspace' >&2
              exit 1
            fi
          done
          grep --fixed-strings -- 'pnpm install --frozen-lockfile --prod' apps/indexer/Dockerfile
