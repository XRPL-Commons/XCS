name: Operations

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: xcs-ci-${{ github.run_id }}-${{ github.run_attempt }}
      XCS_POSTGRES_ADMIN_PASSWORD: compose-ci-admin-password-00000001
      XCS_INDEXER_DATABASE_PASSWORD: compose-ci-indexer-password-0001
      XCS_API_DATABASE_PASSWORD: compose-ci-api-password-000000001
      XCS_MONITOR_DATABASE_PASSWORD: compose-ci-monitor-password-000001
      XCS_INTERNAL_API_TOKEN: compose-ci-internal-token-00000000001
      XCS_METRICS_ENABLED: 'true'
      XCS_METRICS_TOKEN: compose-ci-metrics-token-000000000001
      XCS_RPC_URL_PRIMARY: wss://primary.invalid.example
      XCS_RPC_URL_SECONDARY: wss://secondary.invalid.example
      XCS_NETWORK_PROFILE: /workspace/config/networks/testnet.example.json
      XCS_PUBLIC_RPC_URL: wss://submission.invalid.example
      XCS_API_IMAGE: xcs-api:ci
      XCS_INDEXER_IMAGE: xcs-indexer:ci
      XCS_DB_IMAGE: xcs-db:ci
      XCS_WEB_IMAGE: xcs-web:ci
      XCS_REVISION: ${{ github.sha }}
      XCS_VERSION: 0.1.0-alpha.1-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare ephemeral Compose secrets
        shell: bash
        run: |
          set -euo pipefail
          SECRET_DIRECTORY="$RUNNER_TEMP/xcs-compose-secrets"
          mkdir -p "$SECRET_DIRECTORY"
          printf '%s' "$XCS_POSTGRES_ADMIN_PASSWORD" > "$SECRET_DIRECTORY/postgres_admin_password"
          printf '%s' "$XCS_INDEXER_DATABASE_PASSWORD" > "$SECRET_DIRECTORY/indexer_database_password"
          printf '%s' "$XCS_METRICS_TOKEN" > "$SECRET_DIRECTORY/xcs_metrics_token"
          printf '%s' 'compose-ci-grafana-password-000001' > "$SECRET_DIRECTORY/grafana_admin_password"
          printf '%s' "$XCS_API_DATABASE_PASSWORD" > "$SECRET_DIRECTORY/api_database_password"
          printf '%s' "$XCS_MONITOR_DATABASE_PASSWORD" > "$SECRET_DIRECTORY/monitor_database_password"
          printf '%s' "$XCS_INTERNAL_API_TOKEN" > "$SECRET_DIRECTORY/internal_api_token"
          printf '%s' "$XCS_RPC_URL_PRIMARY" > "$SECRET_DIRECTORY/rpc_url_primary"
          printf '%s' "$XCS_RPC_URL_SECONDARY" > "$SECRET_DIRECTORY/rpc_url_secondary"
          # Compose file-backed secrets retain the host mode. The directory is
          # private while 0644 lets each image's distinct unprivileged UID read
          # only the files explicitly mounted into that service.
          chmod 700 "$SECRET_DIRECTORY"
          chmod 644 "$SECRET_DIRECTORY"/*
          {
            echo "XCS_POSTGRES_ADMIN_PASSWORD_FILE=$SECRET_DIRECTORY/postgres_admin_password"
            echo "XCS_INDEXER_DATABASE_PASSWORD_FILE=$SECRET_DIRECTORY/indexer_database_password"
            echo "XCS_METRICS_TOKEN_FILE=$SECRET_DIRECTORY/xcs_metrics_token"
            echo "XCS_GRAFANA_ADMIN_PASSWORD_FILE=$SECRET_DIRECTORY/grafana_admin_password"
            echo "XCS_API_DATABASE_PASSWORD_FILE=$SECRET_DIRECTORY/api_database_password"
            echo "XCS_MONITOR_DATABASE_PASSWORD_FILE=$SECRET_DIRECTORY/monitor_database_password"
            echo "XCS_INTERNAL_API_TOKEN_FILE=$SECRET_DIRECTORY/internal_api_token"
            echo "XCS_RPC_URL_PRIMARY_FILE=$SECRET_DIRECTORY/rpc_url_primary"
            echo "XCS_RPC_URL_SECONDARY_FILE=$SECRET_DIRECTORY/rpc_url_secondary"
          } >> "$GITHUB_ENV"

      - name: Render and validate every Compose profile
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose --profile site --profile monitoring --profile demo-pinning config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile monitoring config --quiet
          docker compose -f docker-compose.yml -f docker-compose.secrets.yml config --quiet

          mapfile -t DEFAULT_SERVICES < <(docker compose config --services | sort)
          EXPECTED=(api db-bootstrap indexer postgres)
          if [[ "${DEFAULT_SERVICES[*]}" != "${EXPECTED[*]}" ]]; then
            printf 'Unexpected default services: %s\n' "${DEFAULT_SERVICES[*]}" >&2
            exit 1
          fi

          docker compose --profile site --profile monitoring --profile demo-pinning config --format json \
            > "$RUNNER_TEMP/xcs-compose.json"
          jq -e '
            (.services.postgres.ports == null) and
            (.services.prometheus.ports == null) and
            (.services.grafana.ports == null) and
            (.services["postgres-exporter"].ports == null) and
            (.services["node-exporter"].ports == null) and
            (.services.ipfs.ports == null) and
            (.services.web.profiles | index("site") != null) and
            (.services.prometheus.profiles | index("monitoring") != null) and
            (.services.grafana.profiles | index("monitoring") != null) and
            (.networks.database.internal == true) and
            (.networks.monitoring.internal == true) and
            ([.services[] | select(.image | endswith(":latest"))] | length == 0)
          ' "$RUNNER_TEMP/xcs-compose.json"

          docker compose -f docker-compose.yml -f docker-compose.dev.yml \
            --profile monitoring --profile demo-pinning config --format json \
            > "$RUNNER_TEMP/xcs-compose-dev.json"
          jq -e '
            [
              .services.postgres.ports[],
              .services.prometheus.ports[],
              .services.grafana.ports[],
              .services.ipfs.ports[]
            ] | all(.host_ip == "127.0.0.1")
          ' "$RUNNER_TEMP/xcs-compose-dev.json"

          docker compose -f docker-compose.yml -f docker-compose.secrets.yml \
            --profile site --profile monitoring config --format json \
            > "$RUNNER_TEMP/xcs-compose-secrets.json"
          jq -e '
            (.services["db-bootstrap"].command == ["node", "dist/bin/bootstrap.js"]) and
            (.services["db-bootstrap"].environment.XCS_DATABASE_URL_TARGET == "XCS_BOOTSTRAP_DATABASE_URL") and
            (.services.postgres.environment.POSTGRES_PASSWORD == null) and
            (.services.postgres.environment.POSTGRES_PASSWORD_FILE == "/run/secrets/postgres_admin_password") and
            (.services["db-bootstrap"].environment.XCS_DATABASE_PASSWORD == null) and
            (.services["db-bootstrap"].environment.XCS_DATABASE_PASSWORD_FILE == "/run/secrets/postgres_admin_password") and
            (.services["db-bootstrap"].environment.XCS_DATABASE_CLUSTER_SCOPE == "dedicated") and
            (.services["db-bootstrap"].environment.XCS_INDEXER_DATABASE_PASSWORD == null) and
            (.services["db-bootstrap"].environment.XCS_INDEXER_DATABASE_PASSWORD_FILE == "/run/secrets/indexer_database_password") and
            (.services["db-bootstrap"].environment.XCS_API_DATABASE_PASSWORD == null) and
            (.services["db-bootstrap"].environment.XCS_API_DATABASE_PASSWORD_FILE == "/run/secrets/api_database_password") and
            (.services["db-bootstrap"].environment.XCS_MONITOR_DATABASE_PASSWORD == null) and
            (.services["db-bootstrap"].environment.XCS_MONITOR_DATABASE_PASSWORD_FILE == "/run/secrets/monitor_database_password") and
            (.services.api.environment.XCS_DATABASE_PASSWORD == null) and
            (.services.api.environment.XCS_DATABASE_PASSWORD_FILE == "/run/secrets/api_database_password") and
            (.services.api.environment.XCS_INTERNAL_API_TOKEN == null) and
            (.services.api.environment.XCS_INTERNAL_API_TOKEN_FILE == "/run/secrets/internal_api_token") and
            (.services.api.environment.XCS_METRICS_TOKEN == null) and
            (.services.api.environment.XCS_METRICS_TOKEN_FILE == "/run/secrets/xcs_metrics_token") and
            (.services.indexer.environment.XCS_DATABASE_PASSWORD == null) and
            (.services.indexer.environment.XCS_RPC_URL_PRIMARY == null) and
            (.services.indexer.environment.XCS_RPC_URL_PRIMARY_FILE == "/run/secrets/rpc_url_primary") and
            (.services.indexer.environment.XCS_RPC_URL_SECONDARY == null) and
            (.services.indexer.environment.XCS_RPC_URL_SECONDARY_FILE == "/run/secrets/rpc_url_secondary") and
            (.services.web.environment.NUXT_API_INTERNAL_TOKEN == null) and
            (.services.web.environment.NUXT_API_INTERNAL_TOKEN_FILE == "/run/secrets/internal_api_token") and
            (.services["postgres-exporter"].environment.DATA_SOURCE_USER == "xcs_monitor") and
            (.services["postgres-exporter"].environment.DATA_SOURCE_PASS_FILE == "/run/secrets/monitor_database_password")
          ' "$RUNNER_TEMP/xcs-compose-secrets.json"

      - name: Validate monitoring configuration with Prometheus
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile monitoring run --rm --no-deps \
            --entrypoint /bin/promtool prometheus \
            check config /etc/prometheus/prometheus.yml
          docker compose --profile monitoring run --rm --no-deps \
            --entrypoint /bin/promtool prometheus \
            check rules /etc/prometheus/rules/xcs-alerts.yml
          docker compose --profile monitoring run --rm --no-deps \
            --entrypoint /bin/promtool prometheus \
            test rules /etc/prometheus/tests/xcs-alerts.test.yml
          jq empty ops/monitoring/grafana/dashboards/*.json

      - name: Build production-only core images
        run: docker compose build db-bootstrap api indexer

      - name: Assert runtime images exclude development tools
        shell: bash
        run: |
          set -euo pipefail
          for IMAGE in "$XCS_DB_IMAGE" "$XCS_API_IMAGE" "$XCS_INDEXER_IMAGE"; do
            docker run --rm --entrypoint sh "$IMAGE" -c \
              'test ! -e node_modules/typescript && test ! -e node_modules/vitest && test ! -e node_modules/tsx'
          done

      - name: Smoke the database bootstrap and API boundary
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            "${COMPOSE[@]}" logs --no-color > "$RUNNER_TEMP/xcs-compose.log" 2>&1 || true
            "${COMPOSE[@]}" down --volumes --remove-orphans || true
          }
          trap cleanup EXIT

          COMPOSE=(docker compose -f docker-compose.yml -f docker-compose.secrets.yml)
          "${COMPOSE[@]}" up --no-build --detach --wait api

          # The bootstrap is deliberately restart-safe. Run it twice after the
          # dependency chain has completed to prove repeated initialization and
          # role provisioning do not require a clean volume.
          "${COMPOSE[@]}" run --rm --no-deps db-bootstrap
          "${COMPOSE[@]}" run --rm --no-deps db-bootstrap

          curl --fail --silent --show-error http://127.0.0.1:3001/health/live > /dev/null
          READY_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3001/health/ready)"
          test "$READY_STATUS" = '503'
          UNAUTHENTICATED_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3001/internal/metrics/prometheus)"
          test "$UNAUTHENTICATED_STATUS" = '401'
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $XCS_METRICS_TOKEN" \
            http://127.0.0.1:3001/internal/metrics/prometheus \
            | grep --fixed-strings 'xcs_database_available'

          if "${COMPOSE[@]}" ps --services --status running | grep --extended-regexp '^(web|prometheus|grafana|postgres-exporter|node-exporter)$'; then
            echo 'A non-core profile service started unexpectedly' >&2
            exit 1
          fi
          if PUBLISHED_POSTGRES="$("${COMPOSE[@]}" port postgres 5432 2>/dev/null)" && [[ -n "$PUBLISHED_POSTGRES" ]]; then
            echo "PostgreSQL was unexpectedly published at $PUBLISHED_POSTGRES" >&2
            exit 1
          fi

          "${COMPOSE[@]}" exec -T postgres psql -U xcs_admin -d xcs --no-psqlrc --tuples-only --no-align \
            --command "
              SELECT
                pg_has_role('xcs_monitor', 'pg_monitor', 'MEMBER')
                AND (SELECT rolconnlimit FROM pg_roles WHERE rolname = 'xcs_indexer') = 12
                AND (SELECT rolconnlimit FROM pg_roles WHERE rolname = 'xcs_api') = 12
                AND (SELECT rolconnlimit FROM pg_roles WHERE rolname = 'xcs_monitor') = 3
                AND NOT has_schema_privilege('xcs_monitor', 'public', 'CREATE')
                AND NOT EXISTS (
                  SELECT 1
                  FROM pg_database database_object
                  CROSS JOIN LATERAL aclexplode(
                    COALESCE(
                      database_object.datacl,
                      acldefault('d', database_object.datdba)
                    )
                  ) database_acl
                  WHERE database_acl.grantee = 0
                    AND database_acl.privilege_type IN ('CONNECT', 'TEMPORARY')
                )
                AND NOT EXISTS (
                  SELECT 1
                  FROM pg_class relation
                  JOIN pg_namespace namespace ON namespace.oid = relation.relnamespace
                  WHERE namespace.nspname = 'public'
                    AND relation.relkind IN ('r', 'p')
                    AND (
                      has_table_privilege('xcs_monitor', relation.oid, 'INSERT')
                      OR has_table_privilege('xcs_monitor', relation.oid, 'UPDATE')
                      OR has_table_privilege('xcs_monitor', relation.oid, 'DELETE')
                      OR has_table_privilege('xcs_monitor', relation.oid, 'TRUNCATE')
                    )
                );
            " | grep --fixed-strings --line-regexp t

          "${COMPOSE[@]}" --profile monitoring up --no-build --detach --wait postgres-exporter
          "${COMPOSE[@]}" exec -T api node -e '
            const waitForExporter = async () => {
              for (let attempt = 0; attempt < 20; attempt += 1) {
                try {
                  const response = await fetch("http://postgres-exporter:9187/metrics")
                  const body = await response.text()
                  if (response.ok && /^pg_up 1$/mu.test(body)) return
                } catch {}
                await new Promise((resolve) => setTimeout(resolve, 500))
              }
              process.exit(1)
            }
            waitForExporter().catch(() => process.exit(1))
          '

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: compose-logs
          path: ${{ runner.temp }}/xcs-compose.log
          if-no-files-found: ignore
          retention-days: 14

  dockerfile-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce runtime image boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep --fixed-strings -- "pnpm --filter \"\$XCS_PACKAGE\" --prod deploy" docker/Dockerfile.node
          grep --fixed-strings -- 'USER node' docker/Dockerfile.node
          grep --fixed-strings -- 'ENTRYPOINT ["/usr/local/bin/xcs-entrypoint"]' docker/Dockerfile.node
          grep --fixed-strings -- '^node:24-alpine@sha256:[0-9a-f]{64}$' .github/workflows/release-artifacts.yml
          RELEASE_NODE_BASE_USES="$(grep --count --fixed-strings -- "--build-arg XCS_NODE_IMAGE=\"\$XCS_RELEASE_NODE_IMAGE\"" .github/workflows/release-artifacts.yml)"
          test "$RELEASE_NODE_BASE_USES" = '3'
          sh -n docker/node-entrypoint.sh
          sh ops/ci/test-node-entrypoint.sh
          if grep --extended-regexp 'COPY --from=build /workspace($|/)' docker/Dockerfile.node; then
            echo 'The production image must not copy the complete build workspace' >&2
            exit 1
          fi
